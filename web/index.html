<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Live Diagram Preview</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .panel {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
      }
      textarea {
        width: 100%;
        height: 70vh;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      img {
        max-width: 100%;
        border: 1px solid #eee;
        background: #fff;
      }
      .error {
        color: #b00020;
        white-space: pre-wrap;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      button {
        padding: 8px 10px;
        cursor: pointer;
      }
      .hint {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="toolbar">
        <button onclick="renderNow()">Render</button>
        <span class="hint">Auto-render after you stop typing (~600ms)</span>
      </div>
      <textarea id="json"></textarea>
      <div class="error" id="error"></div>
    </div>

    <div class="panel">
      <h3>Preview</h3>
      <div id="status" class="hint"></div>
      <img id="preview" alt="diagram preview" />
    </div>

    <script>
      const textarea = document.getElementById("json");
      const img = document.getElementById("preview");
      const errorEl = document.getElementById("error");
      const statusEl = document.getElementById("status");

      let timer = null;

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      async function renderNow() {
        errorEl.textContent = "";
        setStatus("Rendering...");

        let payload;
        try {
          payload = JSON.parse(textarea.value);
        } catch (e) {
          errorEl.textContent = "JSON parse error:\n" + e.message;
          setStatus("Fix JSON error");
          return;
        }

        try {
          const res = await fetch("/render", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          // If backend returns JSON error
          const contentType = res.headers.get("content-type") || "";
          if (!res.ok) {
            if (contentType.includes("application/json")) {
              const j = await res.json();
              throw new Error(j.error || "HTTP " + res.status);
            } else {
              throw new Error("HTTP " + res.status);
            }
          }

          const blob = await res.blob();
          const url = URL.createObjectURL(blob);

          // Refresh image
          img.src = url;
          setStatus("Rendered ✓");
        } catch (e) {
          errorEl.textContent = "Render error:\n" + e.message;
          setStatus("Render failed");
        }
      }

      textarea.addEventListener("input", () => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(renderNow, 600);
      });

      // starter JSON
      textarea.value = JSON.stringify(
        {
          graph: { title: "Live Diagram", direction: "LR", outformat: "png" },
          nodes: [
            {
              id: "u",
              label: "User",
              node_class: "diagrams.generic.user.User",
            },
            {
              id: "api",
              label: "API",
              node_class: "diagrams.generic.compute.Server",
            },
            {
              id: "db",
              label: "DB",
              node_class: "diagrams.generic.database.SQL",
            },
          ],
          clusters: [
            {
              name: "App",
              graph_attr: {
                style: "rounded,filled",
                bgcolor: "#E8F5E9",
                color: "#43A047",
                penwidth: "2",
              },
              node_ids: ["api"],
            },
            {
              name: "Data",
              graph_attr: {
                style: "rounded,filled",
                bgcolor: "#FFF3E0",
                color: "#FB8C00",
                penwidth: "2",
              },
              node_ids: ["db"],
            },
          ],
          edges: [
            { from: "u", to: "api", attributes: { label: "HTTPS" } },
            {
              from: "api",
              to: "db",
              attributes: { label: "SQL", color: "#6D4C41" },
            },
          ],
        },
        null,
        2,
      );

      // initial render
      renderNow();
    </script>
  </body>
</html>
