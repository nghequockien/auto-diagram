<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Live Diagram Preview (Monaco)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="/static/index_beautiful.css">

    <!-- RequireJS (needed to load Monaco from CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script>
      // Monaco base path on CDN
      window.MONACO_BASE =
        "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min";
    </script>
  </head>

  <body>
    <!-- Left: Editor -->
    <div class="panel">
      <div class="toolbar">
        <button onclick="toggleMinimize(this)" title="Minimize Editor">▼</button>
        <button onclick="renderNow()">Render</button>
        <button onclick="formatJson()">Format JSON</button>
        <button onclick="minifyJson()">Minify</button>
        <span class="hint">Auto-render after you stop typing (~600ms)</span>
      </div>
      <div id="editor"></div>
      <div class="error" id="error"></div>
    </div>

    <!-- Right: Preview -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <p class="title" style="margin: 0;">Preview</p>
        <div class="zoom-controls">
          <button onclick="zoomOut()" title="Zoom Out">−</button>
          <span id="zoomLevel" class="zoom-level">100%</span>
          <button onclick="zoomIn()" title="Zoom In">+</button>
          <button onclick="zoomReset()" title="Reset Zoom">Reset</button>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div id="previewContainer" class="preview-container">
        <img id="preview" alt="diagram preview" />
      </div>
    </div>

    <script src="/static/index_beautiful.js"></script>
  </body>
</html>
